name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Rules tests and AI-vs-AI smoke test
        run: npm test
      - run: npx vite build
      - run: touch dist/.nojekyll
      # Home-screen icon: the Dark Armed Dragon artwork, saved next to the site so iOS can use it.
      - name: App icon (Dark Armed Dragon)
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          URL=$(curl -fsSL "https://db.ygoprodeck.com/api/v7/cardinfo.php?id=65192027" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['card_images'][0]['image_url_cropped'])")
          echo "Artwork: $URL"
          curl -fsSL "$URL" -o /tmp/dad.jpg
          for s in 180 192 512; do convert /tmp/dad.jpg -resize ${s}x${s}^ -gravity center -extent ${s}x${s} -strip /tmp/icon-$s.png; done
          cp /tmp/icon-180.png dist/apple-touch-icon.png
          cp /tmp/icon-192.png dist/icon-192.png
          cp /tmp/icon-512.png dist/icon-512.png
          cp /tmp/icon-512.png dist/icon-maskable-512.png
          ls -la dist/*.png
      # GitHub Pages serves the gh-pages branch (https://akelius-mm.github.io/Edison-Format/).
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
      # Pushes made by the workflow token don't start a Pages build on their own, so request one.
      - name: Publish the new build on GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          echo
          echo "Pages build requested."

